# Sanitised from the live file. Database credentials come from .env.
# Copy .env.example to .env and fill it in; .env is gitignored and chmod 600.

services:
  firefly_iii_db:
    image: postgres:15
    container_name: firefly-iii-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - firefly_iii_db_data:/var/lib/postgresql/data
    networks:
    - firefly_iii
  firefly_iii_app:
    image: fireflyiii/core:latest
    container_name: firefly-iii-app
    restart: unless-stopped
    volumes:
    - firefly_iii_upload:/var/www/html/storage/upload
    env_file:
    - .env
    ports:
    - 8085:8080
    depends_on:
    - firefly_iii_db
    networks:
    - firefly_iii
  firefly_iii_cron:
    image: alpine:latest
    container_name: firefly-iii-cron
    restart: unless-stopped
    command: sh -c "echo 0 3 * * * wget -qO- http://firefly-iii-app:8080/api/v1/cron/YOUR_CRON_TOKEN
      | crontab - && crond -f -l 2"
    depends_on:
    - firefly_iii_app
    networks:
    - firefly_iii
  firefly_iii_importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-iii-importer
    restart: unless-stopped
    ports:
    - 8086:8080
    depends_on:
    - firefly_iii_app
    networks:
    - firefly_iii
volumes:
  firefly_iii_db_data: null
  firefly_iii_upload: null
networks:
  firefly_iii:
    driver: bridge
